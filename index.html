<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <header>

    </header>
    <main>
        <section class="venta">
            <div class="formularioVenta">
                <form action="" id="formulario">
                    <label for="codigo">Digite el Codigo del Producto</label>
                    <input type="text" id="codigo" required placeholder="Codigo del Producto">
                    <label for="nombre">Digite el Nombre del Producto</label>
                    <input type="text" id="nombre" required placeholder="Nombre del Producto">
                    <label for="precio">Digite el Precio del Producto</label>
                    <input type="number" id="precio" required placeholder="Precio del Producto">
                    <label for="cantidad">Digite la Cantidad de Productos</label>
                    <input type="number" id="cantidad" required placeholder="Cantidad del Producto">
                    <button type="submit" id="botonAgregar">Agregar</button>
                </form>
            </div>
            <div class="vistas">
                <div id="result">
                    <table id="tabla">
                        <thead>
                            <tr>
                                <th>Codigo</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <script src="./static/js/script.js"></script>
</body>
</html>
